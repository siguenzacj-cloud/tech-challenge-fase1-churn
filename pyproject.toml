[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn"
version = "0.1.0"
description = "Pipeline preditivo de churn com modelagem clássica e API REST — Tech Challenge Fase 1 (FIAP POSTECH)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas==3.0.5",
    "numpy==2.5.3",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
